name: Deploy DocFX to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build
        run: docfx docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # 操作案内チャットボット（chatbot/）を Cloudflare Workers にデプロイする。
  # マニュアルの本文を Worker に同梱するので、マニュアルを直して main に入れるたびに流す。
  # 初回セットアップ（chatbot/README.md）が済んでから、リポジトリの変数 CHATBOT_DEPLOY を true にすると動く。
  deploy-chatbot:
    if: vars.CHATBOT_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chatbot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply union-dues-manual-chat --remote

      - name: Deploy Worker
        run: npm run deploy
